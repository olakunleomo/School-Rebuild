<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Portal</title>
<style>
:root{--primary:#0478;--accent:#f63;--ink:#0f172a;--muted:#64748b;--bg:#f8fafc;--card:#fff;--line:#e2e8f0;--bad:#c62828;--good:#15803d;--soft:color-mix(in srgb,var(--primary) 12%,white)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;font-size:15px;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
svg{flex:none}
.hide{display:none!important}
.logo{width:56px;height:56px;border-radius:14px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover}

/* login */
.login-page{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:linear-gradient(165deg,color-mix(in srgb,var(--primary) 42%,#0b1d16),color-mix(in srgb,var(--primary) 78%,#2a7f8c))}
.login-card{background:whitesmoke;border-radius:22px;padding:34px 30px 28px;width:100%;max-width:440px;box-shadow:0 24px 60px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.4)}
.login-card .logo{width:60px;height:60px;border-radius:16px;margin-bottom:22px}
.login-card h1{text-align:center;font-size:30px;font-weight:800;letter-spacing:-.01em}
.login-card .lead{text-align:center;color:var(--muted);font-size:17px;margin:6px 0 26px}
.login-card label.f>span{color:var(--ink);font-size:15px;margin-bottom:8px}
.login-card input{height:52px;border-radius:14px;font-size:16px}
.pw{position:relative}.pw input{padding-right:48px}
.eye{position:absolute;right:6px;top:0;height:52px;width:44px;border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.btn.big{width:100%;height:52px;border-radius:14px;font-size:17px;font-weight:500}
.help{text-align:center;color:var(--muted);font-size:14.5px;margin-top:20px}
.err{color:var(--bad);font-size:14px;margin:2px 0 10px;min-height:20px}

/* buttons and forms */
.btn{display:inline-block;padding:10px 18px;border-radius:12px;font-weight:600;font-size:14.5px;border:1.5px solid var(--primary);cursor:pointer;background:var(--primary);color:#fff;text-align:center}
.btn:disabled{opacity:.5;cursor:default}
label.f{display:block;margin-bottom:14px}
label.f>span{display:block;font-size:13.5px;font-weight:600;color:#475569;margin-bottom:5px}
input[type=text],input[type=password],input[type=date],input[type=email],input[type=number],input[type=search],input[type=color],select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
input:focus,select:focus,textarea:focus{outline:3px solid color-mix(in srgb,var(--primary) 25%,white);border-color:var(--primary)}
/* app shell */
.app{min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:min(300px,80vw);background:#fff;z-index:70;display:flex;flex-direction:column;transform:translateX(-105%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.2);overflow-y:auto}
.sidebar.open{transform:none}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:65;display:none}.overlay.show{display:block}
.sb-head{display:flex;align-items:center;gap:14px;padding:22px 18px 18px}
.sb-head .logo{width:52px;height:52px}
.sb-name{min-width:0;flex:1}.sb-name b{display:block;font-size:20px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}.sb-name span{display:block;color:var(--muted);font-size:14.5px}
.mclose{align-self:flex-start;border:0;background:none;color:var(--muted);cursor:pointer;padding:4px}
.sb-nav{padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.sb-nav a{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:14px;font-size:17px;font-weight:500;color:#334155}
.sb-nav a:hover{background:var(--bg)}.sb-nav a.on{background:var(--primary);color:#fff}
.sb-foot{border-top:1px solid var(--line);padding:20px 18px 22px;margin-top:10px}
.sb-foot b{display:block;font-size:17px;font-weight:600}.sb-foot span{display:block;color:var(--muted);margin-bottom:14px}
.btn.out{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;background:#fff;color:var(--ink);border:1px solid var(--line);height:50px;border-radius:12px;font-size:16px;font-weight:500}
.mtop{display:flex;align-items:center;gap:14px;background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;position:sticky;top:0;z-index:30}
.mtop .logo{width:44px;height:44px;border-radius:12px;font-size:18px}.mtop b{font-size:18px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.burger{border:0;background:none;cursor:pointer;color:var(--ink);padding:2px;display:grid}
main#view{padding:26px 18px 60px;min-width:0;max-width:1120px}
@media(min-width:900px){
  .sidebar{width:272px;transform:none;box-shadow:none;border-right:1px solid var(--line)}
  .overlay,.overlay.show{display:none}
  .mclose,.mtop{display:none}
  .content{margin-left:272px}
  main#view{padding:34px 36px 60px}
}

/* pages and dashboard */
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.pagehead h2{font-size:30px;font-weight:800;letter-spacing:-.015em;line-height:1.15}
.sub{color:var(--muted);font-size:17px;margin-top:6px}.sub b{color:var(--primary);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.card h3{font-size:19px;font-weight:700;margin-bottom:10px}.card p{color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
@media(min-width:900px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat2{background:whitesmoke;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 1px 3px rgba(15,23,42,.05);display:flex;flex-direction:column;justify-content:space-between;min-height:152px}
.stat-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.stat-top span{color:var(--muted);font-size:17px}
.sico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.sico.g{background:#d1fae5;color:#047857}.sico.b{background:#e0f2fe;color:#0369a1}.sico.a{background:#fef3c7;color:#b45309}.sico.p{background:#ede9fe;color:#6d28d9}
.stat2>b{font-size:42px;font-weight:800;line-height:1}
.guide ol{padding-left:0;list-style:none;display:flex;flex-direction:column;gap:12px;color:#475569;font-size:16.5px}
.guide li b{color:#334155}
.note{background:whitesmoke;border:1px solid #fde68a;border-radius:12px;padding:11px 15px;margin-bottom:16px;font-size:14.5px}
.empty{padding:34px;text-align:center;color:var(--muted)}
/* more buttons, lists, modal */
.btn.ghost{background:#fff;color:var(--primary)}
.btn.danger{background:#fff;border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end}
.toolbar>*{min-width:150px;flex:1 1 150px;max-width:260px}
.toolbar .btn{flex:0 0 auto;min-width:0}
.tablebox{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow-x:auto;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);color:var(--primary)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.list .li{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.list .li:last-child{border-bottom:0}.list .li span.t{flex:1;min-width:120px;overflow-wrap:anywhere}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:flex-start;justify-content:center;z-index:90;padding:24px 14px;overflow:auto}
.modal.show{display:flex}
.box{background:#fff;border-radius:20px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.box.wide{max-width:900px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h3{font-size:19px}.x{border:0;background:none;font-size:26px;cursor:pointer;line-height:1;color:var(--muted)}
.mb{padding:20px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.acts .sp{flex:1}
/* tables, forms, chips, login slips */
table{width:100%;border-collapse:collapse}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
th{background:#f1f5f9;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}
.pill.off{background:#fee2e2;color:var(--bad)}.pill.ok{background:#dcfce7;color:var(--good)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}
.check{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:14px}.check input{width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chip{background:var(--soft);color:var(--primary);border-radius:99px;padding:3px 6px 3px 12px;font-size:13px;display:flex;gap:6px;align-items:center}
.chip button{border:0;background:none;cursor:pointer;font-size:16px;line-height:1;color:var(--primary)}
.cred{background:var(--bg);border:1px dashed var(--primary);border-radius:12px;padding:12px 16px;margin-bottom:10px;font-size:15px}
.cred b{font-family:ui-monospace,Consolas,monospace;font-size:16px;user-select:all}

/* printing */
.sheet{background:#fff;border:1px solid var(--line);border-radius:8px;padding:26px;margin-bottom:20px;color:#111;overflow-x:auto}
.sh-title{text-align:center;font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;margin:10px 0}
.sh-key{font-size:12px;color:#444;margin:8px 0}
#printArea{display:none}
@page{size:A4;margin:12mm}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  body{background:#fff}
  #printArea .sheet{border:0;border-radius:0;padding:0;margin:0;page-break-after:always;break-after:page;overflow:visible}
  #printArea .sheet:last-child{page-break-after:auto;break-after:auto}
}
/* grade entry */
td.num,th.num{text-align:center}
.gin{width:80px;text-align:center;padding:7px}
.gin.bad{border-color:var(--bad);background:#fef2f2}
/* result sheet */
.sh-head{display:flex;gap:16px;align-items:center;border-bottom:3px double #333;padding-bottom:12px;margin-bottom:12px}
.sh-head .logo{width:64px;height:64px;border-radius:10px}
.sh-head h2{font-size:21px;text-transform:uppercase;letter-spacing:.03em}.sh-head p{font-size:12.5px;color:#444}
.sh-info{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 18px;font-size:13.5px;margin-bottom:12px}
.sh-info span{color:#555}
.sheet table{margin-bottom:12px;min-width:480px}.sheet th,.sheet td{border:1px solid #bbb;padding:6px 8px;font-size:13px}
.sheet th{background:#eceff6;color:#222;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sh-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.sh-sum div{border:1px solid #bbb;padding:7px 10px;font-size:13px}.sh-sum b{display:block;font-size:16px}
.sh-sign{display:flex;justify-content:space-between;gap:30px;margin-top:34px;font-size:12.5px}
.sh-sign div{flex:1;border-top:1px solid #333;padding-top:4px;text-align:center}
.sh-cum{border:2px solid #333;margin-top:6px;padding:8px 10px}
.sh-cum h4{font-size:13px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
@media(max-width:620px){.sh-info{grid-template-columns:1fr 1fr}.sheet{padding:14px}}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
/* toast messages */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
#toast div{background:#0f172a;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast div.e{background:var(--bad)}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal"></div>
<div id="toast"></div>
<div id ="printArea"></div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: body ? JSON.stringify(body) : undefined });
  let d = {}; try { d = await r.json(); } catch (e) { /* no body */ }
  if (!r.ok) { const e = new Error(d.error || 'Request failed'); e.status = r.status; throw e; }
  return d;
}

const S = { pub: null, me: null, page: null };
const toast = (m, bad) => { const d = document.createElement('div'); d.textContent = m; if (bad) d.className = 'e'; $('#toast').appendChild(d); setTimeout(() => d.remove(), bad ? 6000 : 3000); };
const fail = e => { if (e.status === 401 && S.me) { S.me = null; render(); } toast(e.message, true); };
function fd(root) {
  const o = {};
  document.querySelectorAll(root + ' [name]').forEach(el => { o[el.name] = el.type === 'checkbox' ? el.checked : el.value; });
  return o;
}
const opts = (list, sel, label = x => x.name, blank) => (blank !== undefined ? `<option value="">${esc(blank)}</option>` : '') + list.map(x => `<option value="${x.id}"${String(x.id) === String(sel) ? ' selected' : ''}>${esc(label(x))}</option>`).join('');
const field = (label, html, hint) => `<label class="f"><span>${label}</span>${html}${hint ? `<small>${hint}</small>` : ''}</label>`;
/* ---------- modal dialogs ---------- */
function openModal(title, body, wide) {
  $('#modal').innerHTML = `<div class="box ${wide ? 'wide' : ''}"><div class="mh"><h3>${esc(title)}</h3><button class="x" onclick="closeModal()" aria-label="Close">×</button></div><div class="mb">${body}</div></div>`;
  $('#modal').classList.add('show');
}
function closeModal() { $('#modal').classList.remove('show'); $('#modal').innerHTML = ''; }
$('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') closeModal(); });
function askText(title, value, label) {
  return new Promise(res => {
    openModal(title, `<form id="qf">${field(label || 'Name', `<input type="text" name="v" value="${esc(value || '')}" autofocus>`)}<div class="acts"><button class="btn" type="submit">Save</button><button class="btn ghost" type="button" onclick="closeModal()">Cancel</button></div></form>`);
    $('#qf').onsubmit = e => { e.preventDefault(); const v = $('#qf [name=v]').value.trim(); closeModal(); res(v || null); };
    $('#modal').querySelector('.x').addEventListener('click', () => res(null));
    setTimeout(() => $('#qf [name=v]').focus(), 30);
  });
}
const inp = (name, val, type = 'text', extra = '') => `<input type="${type}" name="${name}" value="${esc(val ?? '')}" ${extra}>`;
const table = (cols, rows, emptyMsg) => rows.length ? `<div class="tablebox"><table><thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>` : `<div class="tablebox"><div class="empty">${emptyMsg}</div></div>`;
const loginCell = p => p.username ? `${esc(p.username)} ${p.login_active === 0 ? '<span class="pill off">off</span>' : ''}` : '<span class="pill off">no login</span>';
const ord = n => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const fmt = n => n == null ? '–' : (Math.round(n * 100) / 100).toString();
const gradeOf = x => x >= 70 ? 'A' : x >= 60 ? 'B' : x >= 50 ? 'C' : x >= 45 ? 'D' : x >= 40 ? 'E' : 'F';
function showCreds(list, title) {
  const rows = list.map(c => `<div class="cred">${c.who ? `<div>${esc(c.who)}</div>` : ''}Username: <b>${esc(c.username)}</b><br>Password: <b>${esc(c.password)}</b></div>`).join('');
  openModal(title || 'Login details', `<p style="margin-bottom:12px">Write these down or print the slip now. The password is not shown again. Only the administrator can reset it.</p>${rows}<div class="acts"><button class="btn" onclick='printCreds(${esc(JSON.stringify(JSON.stringify(list)))})'>Print slip</button><button class="btn ghost" onclick="closeModal()">Done</button></div>`);
}
function printCreds(json) {
  const list = JSON.parse(json);
  printHTML(list.map(c => `<div class="sheet"><div class="sh-title">${esc(S.pub.schoolName)} Portal Login</div><p style="margin:10px 0">${esc(c.who || '')}</p><p style="font-size:16px">Username: <b>${esc(c.username)}</b></p><p style="font-size:16px">Password: <b>${esc(c.password)}</b></p><p class="sh-key">Keep this slip safe. Passwords can only be reset by the school administrator.</p></div>`).join(''));
}
function printHTML(html) {
  $('#printArea').innerHTML = html;
  setTimeout(() => { window.print(); }, 60);
}
async function makeLogin(role, ref) {
  try { const c = await api('POST', '/api/users', { role, ref_id: ref }); closeModal(); showCreds([c]); S.page === 'students' ? loadStudents() : route(); } catch (e) { fail(e); }
}
/* ---------- icons, theme, header ---------- */
const ICONS = {
  book: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
  dash: '<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',
  cap: '<path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>',
  user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  layers: '<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>',
  up: '<circle cx="12" cy="12" r="10"/><path d="m16 12-4-4-4 4"/><path d="M12 16V8"/>',
  print: '<path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/>',
  key: '<path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/>',
  out: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>',
  menu: '<line x1="4" x2="20" y1="7" y2="7"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="17" y2="17"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  eye: '<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>',

async function route() {
  const nav = NAV[S.me.role];

  const page = PAGES[k] || (async () => { V().innerHTML = head(nav.find(n => n[0] === k)[1]) + '<div class="note">This page is coming in a later step.</div>'; });

function gcalc(el) {
  const tr = el.closest('tr'), ca = tr.querySelector('[data-f=ca]'), ex = tr.querySelector('[data-f=exam]');

  if (ca.value === '' && ex.value === '') { tr.querySelector('.gt').textContent = '–'; tr.querySelector('.gg').textContent = '–'; return; }
  const t = (+ca.value || 0) + (+ex.value || 0);

async function restoreBackup() {
  const f = $('#rfile').files[0];
  if (!f) return toast('Choose a backup file first', true);
  if (prompt(`Restore from "${f.name}"?\n\nThis replaces ALL current school data with the contents of this file. Everyone will be logged out.\n\nType RESTORE to continue.`) !== 'RESTORE') return;
  try {
    const r = await fetch('/api/restore', { method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, credentials: 'same-origin', body: f });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Restore failed');
    location.hash = ''; S.me = null; await boot();
    toast('Backup restored. Please log in again.');
  } catch (e) { toast(e.message, true); }
}
boot().catch(e => {
  $('#app').innerHTML = `<div class="login-page"><div class="login-card"><h1>Portal temporarily unavailable</h1><p class="lead">${esc(e.message || 'Please try again shortly.')}</p><button class="btn big" onclick="location.reload()">Try again</button></div></div>`;
});
</script>
